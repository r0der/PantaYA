<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vademecum Digital</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    padding: 28px;
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
    color: #1d1d1f;
  }
  p.subtitle {
    margin: 0 0 22px;
    color: #86868b;
    font-size: 14px;
    letter-spacing: -0.01em;
  }
  .buscador {
    position: relative;
    display: flex;
    gap: 8px;
  }
  input {
    flex: 1;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid #d2d2d7;
    font-size: 15px;
    font-family: inherit;
    width: 100%;
    background: #fafafa;
    transition: border-color 0.15s, background 0.15s;
  }
  input:focus {
    outline: none;
    border-color: #0071e3;
    background: #fff;
  }
  button {
    background: #0071e3;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #0077ed; }
  button:disabled { background: #d2d2d7; cursor: default; }
  #sugerencias {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #e5e5e7;
    border-radius: 12px;
    margin-top: 6px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    display: none;
  }
  #sugerencias div {
    padding: 11px 16px;
    font-size: 14px;
    cursor: pointer;
    color: #1d1d1f;
    transition: background 0.1s;
  }
  #sugerencias div:hover { background: #f5f5f7; }
  #resultado { margin-top: 22px; }
  .producto {
    border: 1px solid #e5e5e7;
    border-radius: 14px;
    padding: 18px;
  }
  .producto h2 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #1d1d1f;
  }
  .error {
    color: #ff3b30;
    font-size: 14px;
    text-align: center;
    padding: 10px 0;
  }
  .loading {
    text-align: center;
    color: #86868b;
    font-size: 14px;
    padding: 10px 0;
  }

  .input-wrapper{
      position:relative;
      flex:1;
  }

  .input-wrapper input{
      width:100%;
      padding-right:40px;
  }

  #btnLimpiar{

      position:absolute;

      right:14px;
      top:50%;

      transform:translateY(-50%);

      font-size:18px;

      color:#999;

      cursor:pointer;

      display:none;

      user-select:none;
  }

  #q::placeholder {
    font-size: 13px;
    color: #6b7280;
    opacity: 1;
}

  #btnLimpiar:hover{
      color:#333;
  }

</style>
</head>
<body>

<div class="card">
  <h1 style="font-size:22px; font-weight:700; letter-spacing:-0.02em; margin:0 0 2px; color:#1d1d1f;">
  Vademecum<span style="color:#0071e3;"> Digital</span>
</h1>
<p class="subtitle" style="margin:0 0 22px;">Precios y datos de medicamentos, al instante</p>

  <div class="buscador">

    <div class="input-wrapper">

        <input
            type="text"
            id="q"
            placeholder="Ej: isis / drospirenona / Siegfried"
            autocomplete="off">

        <span id="btnLimpiar">✕</span>

    </div>

    <button id="btnBuscar">Buscar</button>

    <div id="sugerencias"></div>

</div>

  <div id="resultado"></div>
</div>

<script>
  const API_BASE = 'https://vizta-jet.vercel.app';

  const input = document.getElementById('q');
  const btn = document.getElementById('btnBuscar');
  const resultado = document.getElementById('resultado');
  const sugerenciasBox = document.getElementById('sugerencias');
  const btnLimpiar = document.getElementById('btnLimpiar');

  let ultimoListado = [];
  let ultimaBusqueda = "";
  let debounceTimer;
  let ultimoTotal = 0;
  let viendoDetalle = false;
  let scrollListado = 0;

  input.addEventListener('input', () => {
    btnLimpiar.style.display =
    input.value.length ? 'block' : 'none';
    clearTimeout(debounceTimer);

    const q = input.value.trim();
    if (q.length < 2) {
      sugerenciasBox.style.display = 'none';
      return;
    }
    debounceTimer = setTimeout(() => cargarSugerencias(q), 250);
  });

  async function cargarSugerencias(q) {
    try {
      const res = await fetch(API_BASE + '/api/sugerencias?q=' + encodeURIComponent(q));
      const data = await res.json();

      if (!data.resultados || data.resultados.length === 0) {

        sugerenciasBox.innerHTML = '';
        sugerenciasBox.scrollTop = 0;
        sugerenciasBox.style.display = 'none';

        return;
      }

      let html = data.resultados
      .map(p => `
        <div onclick="elegirSugerencia('${p.nombre.replace(/'/g, "\\'")}')">
          <b>${p.nombre}</b><br>
          <small style="color:#6b7280;">
            ${p.droga || ''}${p.laboratorio ? ' - ' + p.laboratorio : ''}
          </small>
        </div>
      `)
      .join('');

    if (data.total > data.resultados.length) {
      html += `
        <div
          onclick="mostrarTodos()"
          style="
            border-top:1px solid #eee;
            text-align:center;
            padding:12px;
            color:#0071e3;
            font-weight:600;
            cursor:pointer;
          ">
          Ver los ${data.total} resultados
        </div>
      `;
    }

    sugerenciasBox.style.display = 'none';

    sugerenciasBox.innerHTML = html;

    sugerenciasBox.scrollTop = 0;

    sugerenciasBox.style.display = 'block';

    } catch (err) {
      sugerenciasBox.style.display = 'none';
    }
  }

  function elegirSugerencia(nombre) {
    input.value = nombre;
    sugerenciasBox.style.display = 'none';
    buscar();
  }

  function mostrarTodos() {
    sugerenciasBox.style.display = 'none';
    buscarTodos();
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.buscador')) {
      sugerenciasBox.style.display = 'none';
    }
  });

  async function buscar() {
    const q = input.value.trim();
    if (!q) return;

    sugerenciasBox.style.display = 'none';
    btn.disabled = true;
    resultado.innerHTML = '<p class="loading">Buscando...</p>';

    try {
      const res = await fetch(API_BASE + '/api/buscar?q=' + encodeURIComponent(q));
      const data = await res.json();

      if (!res.ok) {
        resultado.innerHTML = '<p class="error">' + data.error + '</p>';
        return;
      }

     const listaPresentaciones = (data.presentaciones || []).map(p => `
        <div style="padding:10px 0; border-bottom:1px solid #f0f0f0;">
          <div style="display:flex; justify-content:space-between;">
            <span style="font-size:14px; color:#374151;">${p.presentacion || 'Presentación'}</span>
            <span style="font-weight:700; color:#059669;">${p.precio}</span>
          </div>
          ${(p.coberturas || [])
            .filter(c => c.importes.length > 0)
            .map(c => `
              <div style="font-size:12px; color:#6b7280; margin-top:4px;">
                <b>${c.nombre}</b>${c.descripcion ? ' — ' + c.descripcion : ''}:
                ${c.importes.map(i => `${i.tipo} ${i.precio}`).join(' / ')}
              </div>
            `).join('')}
        </div>
      `).join('');

      resultado.innerHTML = `
      ${viendoDetalle ? `
        <button 
        onclick="volverAlListado()"
        style="
        background:none;
        border:none;
        color:#0071e3;
        font-size:15px;
        font-weight:600;
        cursor:pointer;
        margin-bottom:15px;
        ">
        ← Volver al listado
        </button>
        ` : ''}
        <div class="producto">
          <h2>${data.nombre}</h2>
          ${data.laboratorio ? `<p style="font-size:13px; color:#6b7280; margin:0 0 8px;">${data.laboratorio}</p>` : ''}
          ${data.droga ? `<p style="font-size:13px; color:#374151; margin:0 0 4px;"><b>Droga:</b> ${data.droga}</p>` : ''}
          ${data.accion ? `<p style="font-size:13px; color:#374151; margin:0 0 10px;"><b>Acción:</b> ${data.accion}</p>` : ''}
          ${listaPresentaciones}
          ${data.descripcion ? `<p style="font-size:12px; color:#9ca3af; margin-top:12px; line-height:1.4;">${data.descripcion}</p>` : ''}
        </div>
      `;
     
    } catch (err) {
      resultado.innerHTML = '<p class="error">Error de conexión. Probá de nuevo.</p>';
    } finally {
      btn.disabled = false;
    }
  }
  
    async function buscarTodos() {

    const q = input.value.trim();
    if (!q) return;

    resultado.innerHTML = '<p class="loading">Buscando medicamentos...</p>';

    try {

        const res = await fetch(
            API_BASE + '/api/buscar-productos?q=' + encodeURIComponent(q)
        );

        const data = await res.json();


        ultimoListado = data.resultados;
        ultimaBusqueda = q;
        ultimoTotal = data.total;
        viendoDetalle = false;


        if (!data.resultados || data.resultados.length === 0) {

            resultado.innerHTML =
                '<p class="error">No se encontraron medicamentos.</p>';

            return;
        }


        mostrarListado(data.resultados, q, data.total);


    } catch (err) {

        console.error(err);

        resultado.innerHTML =
            '<p class="error">Error al buscar medicamentos.</p>';

    }

}

function mostrarListado(productos, q, total) {

    resultado.innerHTML = `

    <div style="margin-bottom:20px;">
        <div style="font-size:28px;font-weight:700;color:#1d1d1f;">
            ${total}
        </div>

        <div style="color:#6b7280;font-size:14px;">
            medicamentos encontrados
        </div>

        <div style="margin-top:8px;font-size:14px;color:#374151;">
            Resultados para:
            <b>${q}</b>
        </div>
    </div>

    ` + productos.map(p => `

    <div
        onclick="buscarProducto('${p.nombre.replace(/'/g, "\\'")}')"
        style="
            background:#fff;
            border:1px solid #e5e5e7;
            border-radius:16px;
            padding:16px;
            margin-bottom:12px;
            cursor:pointer;
            transition:.15s;
        "
    >

        <div style="font-size:18px;font-weight:700;color:#1d1d1f;">
            ${p.nombre}
        </div>

        <div style="margin-top:8px;font-size:14px;color:#4b5563;">
            ${p.droga || '-'}
        </div>

        <div style="margin-top:4px;font-size:14px;color:#6b7280;">
            ${p.laboratorio || '-'}
        </div>

        <div style="
            margin-top:12px;
            color:#0071e3;
            font-weight:600;
            font-size:14px;
        ">
            Ver precios →
        </div>

    </div>

    `).join('');

}

  function volverAlListado() {

    if (!ultimoListado) return;

    // vuelve a pintar exactamente las cards
}

  function buscarProducto(nombre){

    // Guardamos la posición actual del listado
    scrollListado = window.scrollY;

    viendoDetalle = true;

    input.value = nombre;

    buscar();

}

  function copiarPrecio(precio) {
    navigator.clipboard.writeText(precio);
  }

  function volverAlListado(){

    viendoDetalle = false;

    input.value = ultimaBusqueda;

    mostrarListado(
        ultimoListado,
        ultimaBusqueda,
        ultimoTotal
    );


    setTimeout(() => {

        window.scrollTo({
            top: scrollListado,
            behavior: "instant"
        });

    }, 50);

  }

  btn.addEventListener('click', buscarTodos);
  input.addEventListener('keydown', (e) => {
    sugerenciasBox.scrollTop = 0;
    if (e.key === 'Enter') buscar();
  });

  btnLimpiar.addEventListener('click', () => {

    input.value='';

    resultado.innerHTML='';

    sugerenciasBox.style.display='none';

    btnLimpiar.style.display='none';

    input.focus();

});

</script>

</body>
</html>
