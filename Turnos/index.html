<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda de Consultorios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1268a9;
  --blue-dark:#0b4f84;
  --ink:#17324a;
  --muted:#8b98a3;
  --line:#e9eef2;
  --soft:#f3f6f8;

  --morning:#b45309;
  --morning-bg:rgba(180,83,9,.11);
  --afternoon:#1268a9;
  --afternoon-bg:rgba(18,104,169,.13);
  --doctor:#12202e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#f5f7f9;
  color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1050px;margin:auto;padding:18px}
h1{font-size:28px;letter-spacing:-.7px;margin:0 0 5px}
.subtitle{margin:0 0 18px;color:var(--muted);font-size:14px}

.panel{
  background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:16px;box-shadow:0 12px 35px rgba(23,50,74,.07)
}
.top{display:grid;grid-template-columns:1fr 190px;gap:12px;margin-bottom:16px}
.top>div{min-width:0}
label{
  display:block;font-size:10px;font-weight:800;text-transform:uppercase;
  color:var(--muted);letter-spacing:.04em;margin:0 0 5px
}
input{
  width:100%;min-width:0;max-width:100%;height:42px;box-sizing:border-box;
  border:1px solid var(--line);border-radius:11px;padding:0 11px;
  font:inherit;font-size:14px;background:#fff;outline:none;display:block
}
input[type="date"],input[type="time"]{
  min-width:0;width:100%;max-width:100%;box-sizing:border-box
}
.time-select{
  width:100%;min-width:0;max-width:100%;height:42px;box-sizing:border-box;
  border:1px solid var(--line);border-radius:11px;padding:0 8px;
  background:#fff;color:var(--ink);font:inherit;font-size:14px;
  outline:none;display:block
}
.time-select:focus{
  border-color:#76add2;box-shadow:0 0 0 3px rgba(18,104,169,.09)
}
#fecha{min-width:0;width:100%;max-width:100%;box-sizing:border-box}
input:focus{border-color:#76add2;box-shadow:0 0 0 3px rgba(18,104,169,.09)}

.editor{display:grid;gap:10px}
.office-edit{
  border:1px solid var(--line);border-radius:16px;padding:12px;background:#fbfcfd
}
.office-title{
  display:flex;align-items:center;gap:8px;font-size:14px;font-weight:850;
  margin-bottom:10px
}
.office-number{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:#eaf4fb;color:var(--blue);font-weight:900
}
.turns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.turn{background:#f5f7f9;border-radius:12px;padding:10px}
.turn.morning{border-left:3px solid var(--morning)}
.turn.afternoon{border-left:3px solid var(--afternoon)}
.turn-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.turn-title{
  font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);
  margin:0
}
.btn-clear-turn{
  border:0;background:#fff;color:var(--muted);font-size:10px;font-weight:800;
  padding:4px 8px;border-radius:8px;cursor:pointer;border:1px solid var(--line);
  white-space:nowrap
}
.btn-clear-turn:hover{color:#a33;border-color:#f3c9c9;background:#fff5f5}
.times{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:7px;margin-top:7px;width:100%
}
.times>div{min-width:0;width:100%;overflow:hidden}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
button{
  border:0;border-radius:11px;padding:11px 15px;font:inherit;font-size:13px;
  font-weight:800;cursor:pointer
}
.primary{background:var(--blue);color:#fff}
.secondary{background:#eaf2f8;color:var(--blue-dark)}
.danger{background:#fff0f0;color:#a33}
.hint{font-size:11px;color:var(--muted);margin-top:9px}

/* ===================== PREVIEW / EXPORT CARD (shared look) ===================== */
.preview-title{margin:25px 0 9px;font-weight:900;font-size:15px}
.preview-wrap{overflow:auto;padding:2px}
.card{
  width:100%;max-width:900px;margin:auto;background:#fff;border-radius:26px;
  overflow:hidden;box-shadow:0 16px 45px rgba(23,50,74,.12)
}
.card-head{
  background:linear-gradient(155deg,#0b4f84,#1a7ac0);
  color:#fff;height:118px;padding:18px 38px;position:relative;
  display:flex;align-items:center;justify-content:space-between
}
.header-pueyrredon{
  display:flex;align-items:center
}
.header-pueyrredon img{
  height:48px;width:auto;display:block
}
.header-siegfried{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px
}
.header-siegfried img{
  height:42px;width:auto;display:block
}
.date-sub{
  font-size:14px;font-weight:800;letter-spacing:-.1px;line-height:1.2;
  margin:0;opacity:.96;text-align:center;white-space:nowrap
}

.rows{padding:4px 34px 10px}
.row{
  display:grid;
  grid-template-columns:82px 1fr 1px 1fr;
  gap:16px;align-items:center;
  min-height:96px;padding:14px 0;
  border-bottom:1px solid var(--line)
}
.row:last-child{border-bottom:0}
.row-divider{align-self:stretch;background:var(--line)}
.number{
  font-size:50px;font-weight:900;color:var(--blue);letter-spacing:-1.5px
}
.shift{min-width:0}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;
  padding:4px 11px;border-radius:20px;margin-bottom:8px
}
.badge .dot{width:6px;height:6px;border-radius:50%;flex:none}
.badge.morning{background:var(--morning-bg);color:var(--morning)}
.badge.morning .dot{background:var(--morning)}
.badge.afternoon{background:var(--afternoon-bg);color:var(--afternoon)}
.badge.afternoon .dot{background:var(--afternoon)}

.doctor{
  font-size:20px;font-weight:900;line-height:24px;letter-spacing:-.2px;
  color:var(--doctor);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.doctor.empty{color:var(--doctor);opacity:.55}
.time{font-size:15px;font-weight:800;margin-top:5px}
.time.morning{color:var(--morning)}
.time.afternoon{color:var(--afternoon)}

.footer{
  margin:8px 34px 26px;padding:9px 14px;background:var(--soft);
  border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;
  color:var(--muted);font-size:11px;font-weight:700
}

/* A4 — todo el contenido (10 consultorios) tiene que entrar en una sola hoja,
   aprovechando el alto disponible sin desbordar */
@media print{
  body{background:#fff}
  .app>h1,.app>.subtitle,.app>.panel,.preview-title{display:none!important}
  .preview-wrap{padding:0;overflow:visible}
  .card{max-width:none;width:100%;box-shadow:none;border-radius:0}

  .card-head{height:auto;padding:7mm 16mm 6mm}
  .header-pueyrredon img{height:9mm}
  .header-siegfried{gap:2mm}
  .header-siegfried img{height:9mm}
  .date-sub{font-size:8.5px}

  .rows{padding:0 12mm}
  .row{
    grid-template-columns:56px 1fr 1px 1fr;gap:11px;
    min-height:0;padding:3.4mm 0
  }
  .number{font-size:30px}
  .badge{font-size:8.5px;padding:2.5px 8px;margin-bottom:4px;gap:4px}
  .badge .dot{width:5px;height:5px}
  .doctor{font-size:13.5px;line-height:16px}
  .time{font-size:10px;margin-top:2.5px}

  .footer{margin:4mm 14mm 0;padding:4px 14px;font-size:8.5px}

  @page{size:A4 portrait;margin:0}
}

@media(max-width:700px){
  .app{padding:10px}
  .top{grid-template-columns:minmax(0,1fr);width:100%}
  .panel{padding:10px}
  .turns{grid-template-columns:1fr}
  .office-edit{padding:10px}
  input{font-size:13px;padding:0 7px}
  input[type="date"]{font-size:12px;padding-left:6px;padding-right:6px}
  .time-select{height:38px;font-size:12px;padding:0 5px}
  .times{gap:6px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .card-head{height:98px;padding:14px 18px}
  .header-pueyrredon img{height:38px}
  .header-siegfried{gap:5px}
  .header-siegfried img{height:34px}
  .date-sub{font-size:11px}
  .rows{padding:4px 14px 6px}
  .row{grid-template-columns:50px 1fr 1px 1fr;gap:7px;min-height:74px;padding:9px 0}
  .number{font-size:30px}
  .badge{font-size:8px;padding:3px 7px;margin-bottom:4px}
  .doctor{font-size:12px;line-height:15px}
  .time{font-size:9px;margin-top:2px}
  .footer{margin:8px 14px 16px;font-size:9px}
}

@media(max-width:360px){
  .times{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <h1>Agenda de Consultorios</h1>
  <p class="subtitle">Cargá el médico y horario de cada turno.</p>

  <div class="panel">
    <div class="top">
      <div><label>Fecha</label><input id="fecha" type="date"></div>
    </div>

    <div id="editor" class="editor"></div>

    <div class="actions">
      <button class="primary" id="btnJpg">🖼️ Exportar JPEG</button>
      <button class="secondary" id="btnShare">📲 WhatsApp / compartir</button>
      <button class="secondary" id="btnMail">✉️ Email</button>
      <button class="secondary" onclick="window.print()">🖨️ Imprimir A4</button>
      <button class="danger" id="btnClear">Limpiar</button>
    </div>
    <div class="hint">La imagen exportada conserva exactamente el diseño de la vista previa, en alta resolución.</div>
  </div>

  <div class="preview-title">Vista previa</div>
  <div class="preview-wrap">
    <div class="card" id="card">
      <div class="card-head">
        <div class="header-pueyrredon">
          <img src="../Turnos/pueyrredon.png" alt="Clínica Pueyrredón">
        </div>
        <div class="header-siegfried">
          <img src="../Turnos/siegfried.png" alt="Laboratorio Siegfried">
          <div class="date-sub" id="pfecha"></div>
        </div>
      </div>
      <div class="rows" id="previewRows"></div>
      <div class="footer">Agenda de atención digital - cortesía laboratorios Siegfried</div>
    </div>
  </div>
  </div>

<script>
const OLD_KEY='agenda_consultorios_v4';
const KEY='agenda_consultorios_v6';

const editor=document.getElementById('editor');
const fecha=document.getElementById('fecha');

const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function formatFecha(d){
  if(!d) return '';
  const dia=DIAS[d.getDay()];
  const nro=String(d.getDate()).padStart(2,'0');
  const mes=MESES[d.getMonth()];
  const anio=d.getFullYear();
  const texto=`${dia}, ${nro} de ${mes} de ${anio}`;
  return texto.charAt(0).toUpperCase()+texto.slice(1);
}

function today(){
  const d=new Date(), off=d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}
fecha.value=today();

function esc(s){
  return String(s||'')
    .replaceAll('&','&amp;').replaceAll('"','&quot;')
    .replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function buildTimeOptions(select,start,end,selected=''){
  const [sh,sm]=start.split(':').map(Number);
  const [eh,em]=end.split(':').map(Number);
  const startMin=sh*60+sm;
  const endMin=eh*60+em;
  let options='<option value="">Seleccionar</option>';

  for(let m=startMin;m<=endMin;m+=15){
    const hh=String(Math.floor(m/60)).padStart(2,'0');
    const mm=String(m%60).padStart(2,'0');
    const value=`${hh}:${mm}`;
    options+=`<option value="${value}">${value}</option>`;
  }
  select.innerHTML=options;
  if(selected && [...select.options].some(o=>o.value===selected)) select.value=selected;
}

function createOffice(n,data={}){
  const box=document.createElement('div');
  box.className='office-edit';
  box.innerHTML=`
    <div class="office-title">
      <span class="office-number">${n}</span>
      Consultorio ${n}
    </div>
    <div class="turns">
      <div class="turn morning">
        <div class="turn-head">
          <p class="turn-title">☀️ Turno mañana</p>
          <button type="button" class="btn-clear-turn" data-clear="manana">Vaciar</button>
        </div>
        <input data-key="mananaMedico" placeholder="Nombre del médico" value="${esc(data.mananaMedico)}">
        <div class="times">
          <div><label>Desde</label><select data-key="mananaDesde" class="time-select" data-start="08:00" data-end="20:00"></select></div>
          <div><label>Hasta</label><select data-key="mananaHasta" class="time-select" data-start="08:00" data-end="20:00"></select></div>
        </div>
      </div>
      <div class="turn afternoon">
        <div class="turn-head">
          <p class="turn-title">🌙 Turno tarde</p>
          <button type="button" class="btn-clear-turn" data-clear="tarde">Vaciar</button>
        </div>
        <input data-key="tardeMedico" placeholder="Nombre del médico" value="${esc(data.tardeMedico)}">
        <div class="times">
          <div><label>Desde</label><select data-key="tardeDesde" class="time-select" data-start="08:00" data-end="20:00"></select></div>
          <div><label>Hasta</label><select data-key="tardeHasta" class="time-select" data-start="08:00" data-end="20:00"></select></div>
        </div>
      </div>
    </div>`;
  box.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',update));
  box.querySelectorAll('.time-select').forEach(select=>{
    buildTimeOptions(select,select.dataset.start,select.dataset.end,data[select.dataset.key]||'');
  });
  box.querySelectorAll('[data-clear]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const prefix=btn.dataset.clear; // 'manana' | 'tarde'
      box.querySelectorAll(`input[data-key^="${prefix}"]`).forEach(input=>input.value='');
      update();
    });
  });
  editor.appendChild(box);
}

for(let i=1;i<=10;i++) createOffice(i);

function getData(){
  return [...editor.children].map((box,i)=>{
    const o={n:i+1};
    box.querySelectorAll('input,select').forEach(input=>o[input.dataset.key]=input.value.trim());
    return o;
  });
}

function save(){
  localStorage.setItem(KEY,JSON.stringify({
    fecha:fecha.value,rows:getData()
  }));
}

function readOldData(){
  try{
    const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
    return old;
  }catch(e){return null}
}

/* type: 'morning' | 'afternoon', exportMode: bool */
function shiftHTML(doc,from,to,label,type,exportMode=false){
  const p=exportMode?'export-':'';
  const hasDoc=!!doc;
  const doctorText=hasDoc?esc(doc):'Sin asignar';
  const timeText=(from||to)?`${esc(from)||'—'} - ${esc(to)||'—'} hs`:'— — — —';
  return `<div class="${p}shift">
    <div class="${p}badge ${type}"><span class="dot"></span>${label}</div>
    <div class="${p}doctor ${type}${hasDoc?'':' empty'}">${doctorText}</div>
    <div class="${p}time ${type}">${timeText}</div>
  </div>`;
}

function update(){
  save();

  const d=fecha.value?new Date(fecha.value+'T12:00:00'):null;
  const dateText=formatFecha(d);

  document.getElementById('pfecha').textContent=dateText;

  const data=getData();
  const divider='<div class="row-divider"></div>';

  document.getElementById('previewRows').innerHTML=data.map(r=>`
    <div class="row">
      <div class="number">${r.n}</div>
      ${shiftHTML(r.mananaMedico,r.mananaDesde,r.mananaHasta,'Mañana','morning')}
      ${divider}
      ${shiftHTML(r.tardeMedico,r.tardeDesde,r.tardeHasta,'Tarde','afternoon')}
    </div>`).join('');
}

function load(){
  try{
    let saved=JSON.parse(localStorage.getItem(KEY)||'null');

    if(!saved){
      const old=readOldData();
      if(old){
        saved=old;
        localStorage.setItem(KEY,JSON.stringify(old));
      }
    }

    if(saved){
      fecha.value=saved.fecha||fecha.value;

      (saved.rows||[]).forEach((r,i)=>{
        if(i<editor.children.length){
          const box=editor.children[i];

          box.querySelectorAll('input,select').forEach(input=>{
            if(input.classList.contains('time-select')){
              buildTimeOptions(
                input,
                input.dataset.start,
                input.dataset.end,
                r[input.dataset.key]||''
              );
            }else{
              input.value=r[input.dataset.key]||'';
            }
          });
        }
      });
    }
  }catch(e){}
  update();
}

async function makeBlob(){
  if(document.fonts && document.fonts.ready){
    try{ await document.fonts.ready; }catch(e){}
  }

  // IMPORTANTE: se exporta el mismo #card que el usuario ve en Vista previa.
  // Ya no existe un diseño paralelo para exportación.
  const node=document.getElementById('card');
  const imgs=[...node.querySelectorAll('img')];

  await Promise.all(imgs.map(img=>{
    if(img.complete && img.naturalWidth) return Promise.resolve();
    return new Promise(res=>{
      img.onload=res;
      img.onerror=res;
    });
  }));

  const rect=node.getBoundingClientRect();

  // Alta resolución sin cambiar proporciones ni tipografías.
  // En escritorio genera al menos 2x; en pantallas chicas sube la escala
  // hasta conseguir como mínimo ~1080 px de ancho.
  const scale=Math.min(4,Math.max(2,1080/rect.width));

  const canvas=await html2canvas(node,{
    scale:scale,
    backgroundColor:'#fff',
    useCORS:true,
    allowTaint:false,
    imageTimeout:15000,
    logging:false
  });

  return await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.98));
}

async function exportJPG(){
  const blob=await makeBlob();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='agenda_'+(fecha.value||'fecha')+'.jpg';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function share(){
  const blob=await makeBlob();
  const file=new File([blob],'agenda.jpg',{type:'image/jpeg'});
  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{
      await navigator.share({
        title:'Agenda de consultorios',
        text:'Agenda diaria',
        files:[file]
      });
      return;
    }catch(e){}
  }
  await exportJPG();
  alert('La imagen fue descargada. Podés adjuntarla desde WhatsApp.');
}

async function mail(){
  const blob=await makeBlob();
  const file=new File([blob],'agenda_'+(fecha.value||'fecha')+'.jpg',{type:'image/jpeg'});

  // En navegadores compatibles, el menú del sistema permite elegir Mail,
  // WhatsApp u otra aplicación y entrega el JPEG como archivo adjunto.
  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{
      await navigator.share({
        title:'Agenda de consultorios',
        text:'Agenda diaria',
        files:[file]
      });
      return;
    }catch(e){
      if(e.name==='AbortError') return;
    }
  }

  // mailto no puede adjuntar archivos por sí solo: descargamos el JPEG
  // y abrimos el correo para que pueda adjuntarse manualmente.
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=file.name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);

  location.href='mailto:?subject='+encodeURIComponent(
    'Agenda de consultorios - '+fecha.value
  )+'&body='+encodeURIComponent(
    'Adjunto la agenda de consultorios del día.'
  );
}

function clearAll(){
  if(!confirm('¿Borrar todos los médicos y horarios?')) return;
  editor.querySelectorAll('input,select').forEach(i=>i.value='');
  update();
}

fecha.addEventListener('input',update);
document.getElementById('btnJpg').addEventListener('click',exportJPG);
document.getElementById('btnShare').addEventListener('click',share);
document.getElementById('btnMail').addEventListener('click',mail);
document.getElementById('btnClear').addEventListener('click',clearAll);

load();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
